function bake(rows, pal, flip, white) {
  const h = rows.length, w = rows[0].length, c = mk(w, h), x = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    if (rows[y].length !== w) console.warn('sprite row width', y, rows[y]);
    for (let i = 0; i < w; i++) {
      const ch = rows[y][i]; if (ch === '.') continue;
      const col = white ? '#ffffff' : pal[ch]; if (!col) continue;
      x.fillStyle = col; x.fillRect(flip ? w - 1 - i : i, y, 1, 1);
    }
  }
  return c;
}
const SP = {};
function bakeAll() {
  const defs = { pawn: [PAWN_A, PAWN_B], knight: [KNIGHT_A, KNIGHT_B], bishop: [BISHOP_A, BISHOP_B] };
  for (const k in defs) {
    const fr = defs[k];
    SP[k] = { w: fr[0][0].length, h: fr[0].length, img: [], white: [] };
    for (let t = 0; t < 2; t++) {
      const pal = Object.assign({}, BASEPAL, TEAM[t]);
      SP[k].img[t] = fr.map(f => [bake(f, pal, false), bake(f, pal, true)]);
    }
    SP[k].white = fr.map(f => [bake(f, null, false, true), bake(f, null, true, true)]);
  }
}

  '!':'010010010000010',':':'000010000010000','.':'000000000000010','-':'000000111000000','+':'000010111010000','/':'001001010100100',' ':'000000000000000',

const ACC = { 'Ã': ['A', [[0,-2],[1,-2],[2,-2]]], 'Ó': ['O', [[1,-2],[2,-3]]], 'Ç': ['C', [[1,5]]], 'Á': ['A', [[1,-2],[2,-3]]] };
const textW = s => s.length * 4 - 1;
function drawText(s, x, y, col, sc = 1, align = 'left', shadow) {
  s = String(s).toUpperCase();
  const w = textW(s) * sc;
  let cx = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  if (shadow) { const sx = cx; drawRaw(s, sx + sc, y + sc, shadow, sc); }
  drawRaw(s, cx, y, col, sc);
}
function drawRaw(s, cx, y, col, sc) {
  g.fillStyle = col;
  for (const ch of s) {
    let base = ch, extra = null;
    if (ACC[ch]) { base = ACC[ch][0]; extra = ACC[ch][1]; }
    const gl = FONT[base] || FONT[' '];
    for (let i = 0; i < 15; i++) if (gl[i] === '1') g.fillRect(cx + (i % 3) * sc, y + ((i / 3) | 0) * sc, sc, sc);
    if (extra) for (const [ex, ey] of extra) g.fillRect(cx + ex * sc, y + ey * sc, sc, sc);
    cx += 4 * sc;
  }
}

// ===================== UNIDADES =====================
const DEF = {
  pawn:   { name: 'PEÃO',      cost: 2, hp: 120, dmg: 10, cd: 0.9, range: 3,  speed: 10, r: 3, mass: 1, aggro: 46 },
  knight: { name: 'CAVALEIRO', cost: 5, hp: 360, dmg: 26, cd: 1.4, range: 4,  speed: 15, r: 5, mass: 3, aggro: 56 },
  bishop: { name: 'BISPO',     cost: 4, hp: 140, dmg: 7,  cd: 1.5, range: 30, speed: 9,  r: 3, mass: 1, aggro: 44,
            ranged: true, heal: 18, healCd: 1.4, healRange: 36 },
};
const CARDS = ['pawn', 'knight', 'bishop'];
const CARD_Y = [246, 340, 434], CARD_X = 219, CARD_W = 42, CARD_H = 88;

// ===================== MAPA =====================
let kind, rocks, trees, castles, shimmer;
const DIR4 = [[1,0],[-1,0],[0,1],[0,-1]];
const kAt = (c, r) => (c < 0 || r < 0 || c >= COLS || r >= ROWS) ? 9 : kind[r * COLS + c];
function freeAt(x, y) {
  if (x < 1 || y < 1 || x > MW - 1 || y > H - 1) return false;
  return kind[((y / TS) | 0) * COLS + ((x / TS) | 0)] === 0;
}
const free = (x, y) => freeAt(x - 2.5, y - 2.5) && freeAt(x + 2.5, y - 2.5) && freeAt(x - 2.5, y + 2.5) && freeAt(x + 2.5, y + 2.5);

function makeCastles() {
  castles = [
    { team: 0, x: 56, y: 464, w: 104, h: 48, hp: 2600, max: 2600, cd: 0, shot: 0, hitT: 0, isCastle: true },
    { team: 1, x: 56, y: 24,  w: 104, h: 48, hp: 2600, max: 2600, cd: 0, shot: 0, hitT: 0, isCastle: true },
  ];
}
function markCastles() {
  for (const c of castles)
    for (let r = c.y / TS; r < (c.y + c.h) / TS; r++)
      for (let q = c.x / TS; q < (c.x + c.w) / TS; q++) kind[r * COLS + q] = 4;
}
function genMap() {
  for (let attempt = 0; attempt < 100; attempt++) {
    kind = new Uint8Array(COLS * ROWS); rocks = []; trees = [];
    markCastles();
    const RMIN = 12, RMAX = 54;
    const nL = 2 + (R() * 2 | 0);
    for (let l = 0; l < nL; l++) {
      const c0 = 2 + (R() * 23 | 0), r0 = RMIN + 2 + (R() * (RMAX - RMIN - 4) | 0);
      if (kAt(c0, r0)) continue;
      const n = 7 + (R() * 11 | 0), set = [[c0, r0]]; kind[r0 * COLS + c0] = 2;
      let guard = 0;
      while (set.length < n && guard++ < 300) {
        const [c, r] = set[R() * set.length | 0], d = DIR4[R() * 4 | 0];
        const nc = c + d[0], nr = r + d[1];
        if (nc < 0 || nc >= COLS || nr < RMIN || nr > RMAX || kAt(nc, nr)) continue;
        kind[nr * COLS + nc] = 2; set.push([nc, nr]);
      }
    }
    const nR = 6 + (R() * 5 | 0);
    for (let i = 0; i < nR; i++) {
      const s = R() < 0.35 ? 2 : 1, c = R() * (COLS - s + 1) | 0, r = RMIN + (R() * (RMAX - RMIN - s + 2) | 0);
      let ok = true;
      for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) if (kAt(c + a, r + b)) ok = false;
      if (!ok) continue;
      for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) kind[(r + b) * COLS + c + a] = 1;
      rocks.push({ c, r, s });
    }
    const nT = 8 + (R() * 7 | 0);
    for (let i = 0; i < nT; i++) {
      const c = R() * COLS | 0, r = RMIN + (R() * (RMAX - RMIN + 1) | 0);
      if (kAt(c, r)) continue;
      kind[r * COLS + c] = 3; trees.push({ c, r, y: r * TS + 7 });
    }
    if (connected()) return;
  }
  kind = new Uint8Array(COLS * ROWS); rocks = []; trees = []; markCastles();
}
function connected() {
  const seen = new Uint8Array(COLS * ROWS), q = [57 * COLS + 13]; seen[q[0]] = 1;
  let n = 0;
  while (q.length) {
    const i = q.pop(); n++;
    const c = i % COLS, r = (i / COLS) | 0;
    for (const [dx, dy] of DIR4) {
      const nc = c + dx, nr = r + dy;
      if (kAt(nc, nr) !== 0) continue;
      const j = nr * COLS + nc; if (seen[j]) continue; seen[j] = 1; q.push(j);
    }
  }
  let total = 0; for (let i = 0; i < kind.length; i++) if (kind[i] === 0) total++;
  return n === total;
}

// ===================== PATHFINDING (A*) =====================
function nearestFreeTile(c, r) {
  if (kAt(c, r) === 0) return [c, r];
  for (let rad = 1; rad < 6; rad++)
    for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== rad) continue;
      if (kAt(c + dx, r + dy) === 0) return [c + dx, r + dy];
    }
  return [c, r];
}
function astar(sc, sr, gc, gr) {
  const N = COLS * ROWS, gs = new Float32Array(N).fill(1e9), from = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const heap = [], hf = [];
  const push = (i, f) => { heap.push(i); hf.push(f); let k = heap.length - 1;
    while (k > 0) { const p = (k - 1) >> 1; if (hf[p] <= hf[k]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; [hf[p], hf[k]] = [hf[k], hf[p]]; k = p; } };
  const pop = () => { const top = heap[0], li = heap.pop(), lf = hf.pop();
    if (heap.length) { heap[0] = li; hf[0] = lf; let k = 0;
      for (;;) { const l = 2 * k + 1, r = l + 1; let m = k;
        if (l < heap.length && hf[l] < hf[m]) m = l; if (r < heap.length && hf[r] < hf[m]) m = r;
        if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; [hf[m], hf[k]] = [hf[k], hf[m]]; k = m; } }
    return top; };
  const hh = (c, r) => { const dx = Math.abs(c - gc), dy = Math.abs(r - gr); return Math.max(dx, dy) + 0.414 * Math.min(dx, dy); };
  const s = sr * COLS + sc, goal = gr * COLS + gc;
  gs[s] = 0; push(s, hh(sc, sr));
  let iter = 0;
  while (heap.length && iter++ < 4000) {
    const i = pop(); if (closed[i]) continue; closed[i] = 1;
    if (i === goal) break;
    const c = i % COLS, r = (i / COLS) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nc = c + dx, nr = r + dy;
      if (kAt(nc, nr) !== 0) continue;
      if (dx && dy && (kAt(c + dx, r) !== 0 || kAt(c, r + dy) !== 0)) continue;
      const j = nr * COLS + nc; if (closed[j]) continue;
      const ng = gs[i] + (dx && dy ? 1.414 : 1);
      if (ng < gs[j]) { gs[j] = ng; from[j] = i; push(j, ng + hh(nc, nr)); }
    }
  }
  if (from[goal] === -1 && goal !== s) return null;
  const path = []; let k = goal;
  while (k !== s && k !== -1) { path.push({ x: (k % COLS) * TS + 4, y: ((k / COLS) | 0) * TS + 4 }); k = from[k]; }
  return path.reverse();
}
function findPath(x, y, gx, gy) {
  const [sc, sr] = nearestFreeTile((x / TS) | 0, (y / TS) | 0);
  const [gc, gr] = nearestFreeTile(clamp((gx / TS) | 0, 0, COLS - 1), clamp((gy / TS) | 0, 0, ROWS - 1));
  const p = astar(sc, sr, gc, gr); if (!p) return null;
  if (free(gx, gy)) { if (p.length) p[p.length - 1] = { x: gx, y: gy }; else p.push({ x: gx, y: gy }); }
  return p;
}
function lineClear(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), n = Math.ceil(L / 3);
  for (let i = 1; i <= n; i++) { const t = i / n; if (!free(x0 + dx * t, y0 + dy * t)) return false; }
  return true;
}

// ===================== ESTADO =====================
let units, projs, parts, texts, gold, over, time, uid, sel, drag, hover, hoverTouch, bot, msg, bgCanvas, castleImg, sideCanvas, treeImg;

function reset() {
  makeCastles(); genMap();
  units = []; projs = []; parts = []; texts = []; gold = [5, 5]; over = null; time = 0; uid = 0;
  sel = -1; drag = null; hover = null; msg = { s: 'DEFENDA SEU CASTELO!', t: 3 };
  bot = { think: 2.5, plan: 'pawn', follow: null };
  buildBackground();
}

function spawn(team, type, x, y) {
  const d = DEF[type];
  const u = { id: ++uid, team, type, d, x, y, hp: d.hp, max: d.hp, cd: 0.4, hcd: 0, target: null, retT: 0,
    path: null, pathT: 0, pathGoal: -1, losT: 0, los: false, face: R() < 0.5 ? 1 : -1, walk: 0, moving: false,
    atkT: 0, hitT: 0, deployT: 0.8, dead: false };
  units.push(u);
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2;
    parts.push({ x: x + Math.cos(a) * 3, y: y + Math.sin(a) * 1.5, vx: Math.cos(a) * 14, vy: Math.sin(a) * 6, life: 0.5, max: 0.5, c: '#d8cfb0' }); }
  return u;
}
function deploy(team, type, x, y) {
  const d = DEF[type];
  if (gold[team] < d.cost) return null;
  const [ymin, ymax] = team === 0 ? [MID + 8, 456] : [80, MID - 8];
  x = clamp(x, 5, MW - 5);
  if (y < ymin || y > ymax) { if (team === 0) return 'zone'; y = clamp(y, ymin, ymax); }
  if (!free(x, y)) {
    let found = false;
    for (let rad = 3; rad <= 12 && !found; rad += 3)
      for (let a = 0; a < 8 && !found; a++) {
        const nx = x + Math.cos(a / 8 * Math.PI * 2) * rad, ny = y + Math.sin(a / 8 * Math.PI * 2) * rad;
        if (ny >= ymin && ny <= ymax && free(nx, ny)) { x = nx; y = ny; found = true; }
      }
    if (!found) return 'blocked';
  }
  gold[team] -= d.cost;
  return spawn(team, type, x, y);
}

// ===================== COMBATE =====================
const isAlive = t => t && (t.isCastle ? t.hp > 0 : !t.dead);
function rectDist(x, y, c) {
  const dx = Math.max(c.x - x, 0, x - (c.x + c.w)), dy = Math.max(c.y - y, 0, y - (c.y + c.h));
  return Math.hypot(dx, dy);
}
function distTo(u, t) { return t.isCastle ? rectDist(u.x, u.y, t) - u.d.r : Math.hypot(t.x - u.x, t.y - u.y) - u.d.r - t.d.r; }
function aimPoint(t, fx, fy) {
  if (!t.isCastle) return { x: t.x, y: t.y - 4 };
  return { x: clamp(fx, t.x + 2, t.x + t.w - 2), y: clamp(fy, t.y + 2, t.y + t.h - 2) };
}
function castlePoint(u, c) {
  if (u.y > c.y + c.h) return { x: clamp(u.x, c.x + 4, c.x + c.w - 4), y: c.y + c.h + 4 };
  if (u.y < c.y) return { x: clamp(u.x, c.x + 4, c.x + c.w - 4), y: c.y - 4 };
  return { x: u.x < c.x + c.w / 2 ? c.x - 4 : c.x + c.w + 4, y: u.y };
}
function nearestEnemy(u, radius) {
  let best = null, bd = radius;
  for (const e of units) {
    if (e.dead || e.team === u.team) continue;
    const d = Math.hypot(e.x - u.x, e.y - u.y) - e.d.r - u.d.r;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function damage(t, dmg, team) {
  if (!isAlive(t)) return;
  t.hp -= dmg; t.hitT = 0.06;
  const p = t.isCastle ? null : t;
  if (p) for (let i = 0; i < 4; i++) parts.push({ x: p.x, y: p.y - 5, vx: (R() - 0.5) * 30, vy: -R() * 25, life: 0.35, max: 0.35, c: i % 2 ? '#ffffff' : '#c83030', gr: 60 });
  if (t.isCastle) {
    if (t.hp <= 0 && !over) { t.hp = 0; over = { win: t.team === 1, t: 0 };
      for (let i = 0; i < 60; i++) parts.push({ x: t.x + R() * t.w, y: t.y + R() * t.h, vx: (R() - 0.5) * 40, vy: -R() * 40, life: 1.5, max: 1.5, c: R() < 0.5 ? '#ff9a30' : '#6a645c', gr: 20 }); }
  } else if (t.hp <= 0) {
    t.dead = true;
    for (let i = 0; i < 12; i++) parts.push({ x: t.x + (R() - 0.5) * 6, y: t.y - R() * 8, vx: (R() - 0.5) * 20, vy: -R() * 20, life: 0.7, max: 0.7, c: i % 3 ? '#bdb6a6' : '#7a7468' });
  }
}
function attack(u, t) {
  const d = u.d;
  const ax = t.isCastle ? clamp(u.x, t.x, t.x + t.w) : t.x;
  if (Math.abs(ax - u.x) > 0.5) u.face = ax > u.x ? 1 : -1;
  if (u.cd > 0) return;
  u.cd = d.cd * (0.9 + R() * 0.2); u.atkT = 0.22;
  const dmg = d.dmg * (0.85 + R() * 0.3);
  if (d.ranged) projs.push({ kind: 'bolt', x: u.x + u.face * 4, y: u.y - 14, t, sp: 90, dmg, team: u.team });
  else damage(t, dmg, u.team);
}
function step(u, tx, ty, dt) {
  const dx = tx - u.x, dy = ty - u.y, L = Math.hypot(dx, dy);
  if (L < 0.3) return;
  const s = Math.min(L, u.d.speed * dt);
  move(u, dx / L * s, dy / L * s);
  u.moving = true;
  if (Math.abs(dx) > 0.4) u.face = dx > 0 ? 1 : -1;
}
function move(u, dx, dy) {
  if (free(u.x + dx, u.y + dy)) { u.x += dx; u.y += dy; }
  else if (free(u.x + dx, u.y)) u.x += dx;

  g.fillStyle = '#1b1420'; g.fillRect(bx - 1, by - 1, bw + 2, 5);
  g.fillStyle = '#3a2a2a'; g.fillRect(bx, by, bw, 3);
  g.fillStyle = T.t; g.fillRect(bx, by, Math.ceil(bw * c.hp / c.max), 3);
  g.fillStyle = T.h; g.fillRect(bx, by, Math.ceil(bw * c.hp / c.max), 1);
  drawText(Math.ceil(c.hp), c.x + 52, by - 7, '#ffffff', 1, 'center', '#1b1420');
}
function drawUnit(u, ghost) {
  const sp = SP[u.type];
  const fr = u.moving ? ((u.walk * 5) | 0) % 2 : 0, flip = u.face < 0 ? 1 : 0;
  let ox = 0, oy = 0;
  if (u.moving && fr) oy = -1;
  if (u.atkT > 0) ox = u.face * (u.atkT > 0.11 ? 2 : 1);
  const dx = Math.round(u.x - sp.w / 2 + ox), dy = Math.round(u.y - sp.h + 2 + oy);
  g.fillStyle = 'rgba(10,20,5,0.35)';
  const r = u.d.r + 1; g.fillRect(Math.round(u.x - r), Math.round(u.y), r * 2 + 1, 2); g.fillRect(Math.round(u.x - r + 1), Math.round(u.y + 2), r * 2 - 1, 1);
  if (!ghost) { g.fillStyle = TEAM[u.team].t; g.fillRect(Math.round(u.x - r + 1), Math.round(u.y + 2), r * 2 - 1, 1); }
  const prevA = g.globalAlpha;
  if (u.deployT > 0) g.globalAlpha = 0.45 + 0.4 * Math.abs(Math.sin(u.deployT * 18));
  if (ghost) g.globalAlpha = ghost;
  g.drawImage(u.hitT > 0 ? sp.white[fr][flip] : sp.img[u.team][fr][flip], dx, dy);
  g.globalAlpha = prevA;
  if (!ghost && u.hp < u.max) {
    const w = u.type === 'knight' ? 14 : 10, bx = Math.round(u.x - w / 2), by = dy - 3;
    g.fillStyle = '#1b1420'; g.fillRect(bx - 1, by - 1, w + 2, 3);
    g.fillStyle = u.team === 0 ? '#5fa0ff' : '#ff5a4a'; g.fillRect(bx, by, Math.max(1, Math.round(w * u.hp / u.max)), 1);
  }
}
function drawCard(i) {
  const type = CARDS[i], d = DEF[type], x = CARD_X;
  let y = CARD_Y[i]; const isSel = sel === i; if (isSel) y -= 3;
  const can = gold[0] >= d.cost;
  g.fillStyle = '#140c06'; g.fillRect(x, y, CARD_W, CARD_H);
  g.fillStyle = isSel ? (Math.sin(time * 8) > 0 ? '#ffe27a' : '#f0c548') : '#8a6a2a'; g.fillRect(x + 1, y + 1, CARD_W - 2, CARD_H - 2);
  g.fillStyle = '#dcc9a0'; g.fillRect(x + 2, y + 2, CARD_W - 4, CARD_H - 4);
  g.fillStyle = '#c2ab7c'; g.fillRect(x + 2, y + CARD_H - 4, CARD_W - 4, 2);
  // janela da arte
  g.fillStyle = '#2a1a10'; g.fillRect(x + 3, y + 4, CARD_W - 6, 48);
  g.fillStyle = '#5a9844'; g.fillRect(x + 4, y + 5, CARD_W - 8, 46);
  g.fillStyle = '#4c853a'; g.fillRect(x + 4, y + 41, CARD_W - 8, 10);
  g.fillStyle = '#8fb4ff'; g.fillRect(x + 4, y + 5, CARD_W - 8, 1);
  const sp = SP[type], img = sp.img[0][0][0];
  g.drawImage(img, Math.round(x + CARD_W / 2 - sp.w), y + 49 - sp.h * 2, sp.w * 2, sp.h * 2);
  drawText(d.name, x + CARD_W / 2, y + 56, '#3a2414', 1, 'center');
  circ(x + CARD_W / 2, y + 74, 7, '#5a3a10');
  circ(x + CARD_W / 2, y + 74, 6, can ? '#f0c548' : '#a89a70');
  circ(x + CARD_W / 2 - 1, y + 73, 3, can ? '#ffe68a' : '#bcb090');
  drawText(d.cost, x + CARD_W / 2 + 1, y + 72, '#3a2414', 1, 'center');
  if (!can) {
    g.fillStyle = 'rgba(16,8,4,0.6)'; g.fillRect(x, y, CARD_W, CARD_H);
    const f = gold[0] / d.cost; g.fillStyle = 'rgba(240,197,72,0.18)'; g.fillRect(x, y + CARD_H * (1 - f), CARD_W, CARD_H * f);
  }
}
function drawSide() {
  g.drawImage(sideCanvas, MW, 0);
  drawText('OURO', MW + 25, 5, '#f0c548', 1, 'center', '#140c06');
  const bx = MW + 17, by = 14, bw = 16, bh = 210, seg = bh / 10;
  g.fillStyle = '#140c06'; g.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  g.fillStyle = '#2a1c10'; g.fillRect(bx, by, bw, bh);
  for (let i = 0; i < 10; i++) {
    const f = clamp(gold[0] - i, 0, 1); if (f <= 0) continue;
    const sy = by + bh - (i + 1) * seg, fh = Math.round((seg - 1) * f);
    g.fillStyle = f >= 1 ? '#f0c548' : '#a8862e'; g.fillRect(bx, sy + seg - 1 - fh, bw, fh);
    g.fillStyle = f >= 1 ? '#fff0a0' : '#c8a850'; g.fillRect(bx + 1, sy + seg - 1 - fh, 2, fh);
    g.fillStyle = '#9a7420'; g.fillRect(bx, sy + seg - 2, bw, 1);
  }
  for (let i = 1; i < 10; i++) { g.fillStyle = '#140c06'; g.fillRect(bx, by + i * seg - 1, bw, 1); }
  drawText(Math.floor(gold[0]), MW + 25, 229, '#ffe68a', 2, 'center', '#140c06');
  for (let i = 0; i < 3; i++) drawCard(i);
}
function render() {
  g.drawImage(bgCanvas, 0, 0);
  for (const s of shimmer) { const v = Math.sin(time * s.sp + s.ph); if (v > 0.55) { g.fillStyle = v > 0.85 ? '#d8f0ff' : '#9cc8f0'; g.fillRect(s.x, s.y, v > 0.85 ? 3 : 2, 1); } }
  if (sel >= 0 && !over) {
    g.fillStyle = 'rgba(160,20,20,0.22)'; g.fillRect(0, 0, MW, MID + 8);
    g.fillStyle = 'rgba(255,255,255,0.7)'; for (let px = (time * 12 | 0) % 6; px < MW; px += 6) g.fillRect(px, MID + 8, 3, 1);
  }
  for (const c of castles) drawCastle(c);
  const list = [];
  for (const u of units) list.push({ y: u.y, u });
  for (const t of trees) list.push({ y: t.y, t });
  list.sort((a, b) => a.y - b.y);
  for (const o of list) {
    if (o.u) drawUnit(o.u); else g.drawImage(treeImg, o.t.c * TS + 4 - 9, o.t.y - 23);
  }
  // fantasma de posicionamento
  if (sel >= 0 && hover && hover.x < MW && !over && (!hoverTouch || (drag && drag.moved))) {
    const ok = hover.y >= MID + 8 && hover.y <= 456 && gold[0] >= DEF[CARDS[sel]].cost;
    drawUnit({ type: CARDS[sel], d: DEF[CARDS[sel]], x: hover.x, y: hover.y, team: 0, face: 1, moving: false, atkT: 0, hitT: 0, deployT: 0, hp: 1, max: 1 }, ok ? 0.6 : 0.25);
    g.fillStyle = ok ? 'rgba(255,255,255,0.8)' : 'rgba(255,80,60,0.9)';
    g.fillRect(Math.round(hover.x) - 6, Math.round(hover.y) + 3, 12, 1);
  }
  for (const p of projs) {
    if (p.kind === 'arrow') {
      for (let k = 0; k < 5; k++) { g.fillStyle = k === 0 ? '#e8e8e8' : k > 3 ? '#f4f0e0' : '#8a5a30'; g.fillRect(Math.round(p.x - (p.vx || 0) * k), Math.round(p.y - (p.vy || 0) * k), 1, 1); }
    } else {
      g.fillStyle = p.kind === 'heal' ? '#c8ffd0' : '#fff6c0'; g.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 2, 2);
      g.fillStyle = p.kind === 'heal' ? 'rgba(125,255,154,0.5)' : 'rgba(255,230,128,0.5)'; g.fillRect(Math.round(p.x) - 2, Math.round(p.y) - 1, 4, 2); g.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 2, 2, 4);
    }
  }
  for (const p of parts) { g.globalAlpha = clamp(p.life / p.max, 0, 1); g.fillStyle = p.c; const s = p.sz || 1; g.fillRect(Math.round(p.x), Math.round(p.y), s, s); }
  g.globalAlpha = 1;
  for (const t of texts) { g.globalAlpha = clamp(t.life * 2, 0, 1); drawText(t.s, t.x, t.y, t.c, 1, 'center', '#1b1420'); }
  g.globalAlpha = 1;
  drawSide();
  if (msg) { g.globalAlpha = clamp(msg.t, 0, 1); g.fillStyle = 'rgba(20,12,6,0.7)'; g.fillRect(0, MID - 9, MW, 18); drawText(msg.s, MW / 2, MID - 3, '#ffe68a', 1, 'center', '#140c06'); g.globalAlpha = 1; }
  if (over) {
    g.fillStyle = `rgba(10,6,4,${clamp(over.t, 0, 0.65)})`; g.fillRect(0, 0, W, H);
    if (over.t > 0.4) {
      drawText(over.win ? 'VITÓRIA!' : 'DERROTA', W / 2, H / 2 - 24, over.win ? '#ffd84a' : '#ff5a4a', 4, 'center', '#140c06');
      if (over.t > 1.2 && Math.sin(time * 5) > -0.4) drawText('TOQUE PARA JOGAR DE NOVO', W / 2, H / 2 + 8, '#f4f0e0', 1, 'center', '#140c06');
    }
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, cv.width, cv.height);
}

// ===================== INPUT =====================
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function cardAt(p) { for (let i = 0; i < 3; i++) if (p.x >= CARD_X && p.x <= CARD_X + CARD_W && p.y >= CARD_Y[i] - 3 && p.y <= CARD_Y[i] + CARD_H) return i; return -1; }
function tryDeploy(p) {
  const r = deploy(0, CARDS[sel], p.x, p.y);
  if (r === 'zone') { msg = { s: 'SÓ NO SEU LADO DO CAMPO', t: 1.2 }; }
  else if (r === 'blocked') { msg = { s: 'LUGAR BLOQUEADO', t: 1 }; }
  else if (!r) { msg = { s: 'OURO INSUFICIENTE', t: 1 }; }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toLogical(e); hover = p; hoverTouch = e.pointerType !== 'mouse';
  if (over) { if (over.t > 1.2) reset(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (p.x >= MW) { const i = cardAt(p); if (i >= 0) { sel = sel === i ? -1 : i; drag = { i, moved: false }; } }
  else if (sel >= 0) tryDeploy(p);
});
cv.addEventListener('pointermove', e => { const p = toLogical(e); hover = p; hoverTouch = e.pointerType !== 'mouse'; if (drag && p.x < MW - 2) drag.moved = true; });
cv.addEventListener('pointerup', e => {
  const p = toLogical(e);
  if (drag && drag.moved && p.x < MW) { sel = drag.i; tryDeploy(p); }
  drag = null; if (hoverTouch) hover = null;
});
cv.addEventListener('pointerleave', () => { if (!drag) hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

function resize() {
  const dpr = window.devicePixelRatio || 1, s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
}
addEventListener('resize', resize);

// ===================== LOOP =====================
bakeAll(); buildTree(); buildSide();
castleImg = [bakeCastle(0), bakeCastle(1)];
reset(); resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { get units() { return units; }, deploy, castles: () => castles, gold: () => gold, update };
</script>
