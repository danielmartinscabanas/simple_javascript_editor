function bake(rows, pal, flip, white) {
  const h = rows.length, w = rows[0].length, c = mk(w, h), x = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    if (rows[y].length !== w) console.warn('sprite row width', y, rows[y]);
    for (let i = 0; i < w; i++) {
      const ch = rows[y][i]; if (ch === '.') continue;
      const col = white ? '#ffffff' : pal[ch]; if (!col) continue;
      x.fillStyle = col; x.fillRect(flip ? w - 1 - i : i, y, 1, 1);
    }
  }
  return c;
}
const SP = {};
function bakeAll() {
  const defs = { pawn: [PAWN_A, PAWN_B], knight: [KNIGHT_A, KNIGHT_B], bishop: [BISHOP_A, BISHOP_B] };
  for (const k in defs) {
    const fr = defs[k];
    SP[k] = { w: fr[0][0].length, h: fr[0].length, img: [], white: [] };
    for (let t = 0; t < 2; t++) {
      const pal = Object.assign({}, BASEPAL, TEAM[t]);

}

const ACC = { 'Ã': ['A', [[0,-2],[1,-2],[2,-2]]], 'Ó': ['O', [[1,-2],[2,-2]]], 'Ç': ['C', [[1,5]]], 'Á': ['A', [[1,-2],[2,-2]]] };

const textW = s => s.length * 4 - 1;
function drawText(s, x, y, col, align = 'left', shadow) {
  s = String(s).toUpperCase();

  const cx = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  if (shadow) drawRaw(s, cx + 1, y + 1, shadow);
  drawRaw(s, cx, y, col);
}
function drawRaw(s, cx, y, col) {
  g.fillStyle = col;
  for (const ch of s) {
    let base = ch, extra = null;
    if (ACC[ch]) { base = ACC[ch][0]; extra = ACC[ch][1]; }
    const gl = FONT[base] || FONT[' '];
    for (let i = 0; i < 15; i++) if (gl[i] === '1') g.fillRect(cx + (i % 3), y + ((i / 3) | 0), 1, 1);
    if (extra) for (const [ex, ey] of extra) g.fillRect(cx + ex, y + ey, 1, 1);
    cx += 4;
  }
}
// Título grosso estilo banner: glifo 5x7 em negrito, duas cores e contorno preto. Pixels sempre 1:1.
function drawBig(s, x, y, fill, shade, outline = C.ink) {
  s = String(s).toUpperCase();
  const w = s.length * 7 + 2, h = 13, m = new Uint8Array(w * h);
  let cx = 1;
  for (const ch of s) {
    let base = ch, extra = [];
    if (ACCB[ch]) { base = ACCB[ch][0]; extra = ACCB[ch][1]; }
    const gl = BIG[base] || BIG[' '];
    for (let i = 0; i < 35; i++) if (gl[i] === '1') { const px = cx + i % 5, py = 4 + ((i / 5) | 0); m[py * w + px] = 1 + (py >= 8 ? 1 : 0); m[py * w + px + 1] = 1 + (py >= 8 ? 1 : 0); }
    for (const [ex, ey] of extra) { m[(4 + ey) * w + cx + ex] = 1; }
    cx += 7;
  }
  const ox = Math.round(x - w / 2), oy = y - 4;
  g.fillStyle = outline;
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    if (m[py * w + px]) continue;
    let n = false;
    for (let dy = -1; dy <= 1 && !n; dy++) for (let dx = -1; dx <= 1; dx++) { const qx = px + dx, qy = py + dy; if (qx >= 0 && qy >= 0 && qx < w && qy < h && m[qy * w + qx]) { n = true; break; } }

  }
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    const v = m[py * w + px]; if (!v) continue;

// ===================== UNIDADES =====================
const DEF = {
  pawn:   { name: 'PEÃO',      cost: 2, hp: 120, dmg: 10, cd: 0.9, range: 3,  speed: 10, r: 3, mass: 1, aggro: 46 },
  knight: { name: 'CAVALEIRO', cost: 5, hp: 360, dmg: 26, cd: 1.4, range: 4,  speed: 15, r: 5, mass: 3, aggro: 56 },
  bishop: { name: 'BISPO',     cost: 4, hp: 140, dmg: 7,  cd: 1.5, range: 30, speed: 9,  r: 3, mass: 1, aggro: 44,
            ranged: true, heal: 18, healCd: 1.4, healRange: 36 },
};
const CARDS = ['pawn', 'knight', 'bishop'];
const CARD_Y = [326, 393, 460], CARD_X = MW + 4, CARD_W = 42, CARD_H = 64;
const BTN = { x: MW + 4, y: 268, w: 42, h: 22 };
const SETUP_COINS = 30;

// ===================== MAPA =====================
let kind, rocks, trees, logs, stumps, castles, shimmer;
const DIR4 = [[1,0],[-1,0],[0,1],[0,-1]];
const kAt = (c, r) => (c < 0 || r < 0 || c >= COLS || r >= ROWS) ? 9 : kind[r * COLS + c];
function freeAt(x, y) {
  if (x < 1 || y < 1 || x > MW - 1 || y > H - 1) return false;
  return kind[((y / TS) | 0) * COLS + ((x / TS) | 0)] === 0;
}
const free = (x, y) => freeAt(x - 2.5, y - 2.5) && freeAt(x + 2.5, y - 2.5) && freeAt(x - 2.5, y + 2.5) && freeAt(x + 2.5, y + 2.5);

function makeCastles() {
  castles = [
    { team: 0, x: 56, y: 464, w: 104, h: 48, hp: 2600, max: 2600, cd: 0, shot: 0, hitT: 0, isCastle: true },
    { team: 1, x: 56, y: 24,  w: 104, h: 48, hp: 2600, max: 2600, cd: 0, shot: 0, hitT: 0, isCastle: true },
  ];
}
function markCastles() {
  for (const c of castles)
    for (let r = c.y / TS; r < (c.y + c.h) / TS; r++)
      for (let q = c.x / TS; q < (c.x + c.w) / TS; q++) kind[r * COLS + q] = 4;
}
function genMap() {
  // 0 grama, 1 pedra, 2 água, 3 árvore, 4 castelo, 5 tronco caído, 6 toco
  for (let attempt = 0; attempt < 150; attempt++) {
    kind = new Uint8Array(COLS * ROWS); rocks = []; trees = []; logs = []; stumps = [];
    markCastles();
    const RMIN = 12, RMAX = 54;
    const okArea = (c, r, w, h) => { for (let a = 0; a < w; a++) for (let b = 0; b < h; b++) if (kAt(c + a, r + b) || r + b < RMIN || r + b > RMAX) return false; return true; };
    const nL = 3 + (R() * 2 | 0);
    for (let l = 0; l < nL; l++) {
      const c0 = 2 + (R() * 23 | 0), r0 = RMIN + 2 + (R() * (RMAX - RMIN - 4) | 0);
      if (kAt(c0, r0)) continue;
      const n = 6 + (R() * 12 | 0), set = [[c0, r0]]; kind[r0 * COLS + c0] = 2;
      let guard = 0;
      while (set.length < n && guard++ < 300) {
        const [c, r] = set[R() * set.length | 0], d = DIR4[R() * 4 | 0];
        const nc = c + d[0], nr = r + d[1];
        if (nc < 0 || nc >= COLS || nr < RMIN || nr > RMAX || kAt(nc, nr)) continue;
        kind[nr * COLS + nc] = 2; set.push([nc, nr]);
      }
    }
    const nR = 10 + (R() * 6 | 0);
    for (let i = 0; i < nR; i++) {
      const s = R() < 0.35 ? 2 : 1, c = R() * (COLS - s + 1) | 0, r = RMIN + (R() * (RMAX - RMIN) | 0);
      if (!okArea(c, r, s, s)) continue;
      for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) kind[(r + b) * COLS + c + a] = 1;
      rocks.push({ c, r, s });
    }
    const nLog = 4 + (R() * 4 | 0);
    for (let i = 0; i < nLog; i++) {
      const hz = R() < 0.6, len = R() < 0.3 ? 3 : 2, w = hz ? len : 1, h = hz ? 1 : len;
      const c = R() * (COLS - w + 1) | 0, r = RMIN + (R() * (RMAX - RMIN) | 0);
      if (!okArea(c, r, w, h)) continue;
      for (let a = 0; a < w; a++) for (let b = 0; b < h; b++) kind[(r + b) * COLS + c + a] = 5;
      logs.push({ c, r, hz, len, flip: R() < 0.5 });
    }
    const nS = 4 + (R() * 4 | 0);
    for (let i = 0; i < nS; i++) {
      const c = R() * COLS | 0, r = RMIN + (R() * (RMAX - RMIN + 1) | 0);
      if (!okArea(c, r, 1, 1)) continue;
      kind[r * COLS + c] = 6; stumps.push({ c, r });
    }
    const nT = 14 + (R() * 9 | 0);
    for (let i = 0; i < nT; i++) {
      // árvores tendem a formar pequenos bosques
      let c, r;
      if (trees.length && R() < 0.5) { const t = trees[R() * trees.length | 0]; c = t.c + (R() * 3 | 0) - 1; r = t.r + (R() * 3 | 0) - 1; }
      else { c = R() * COLS | 0; r = RMIN + (R() * (RMAX - RMIN + 1) | 0); }
      if (c < 0 || c >= COLS || !okArea(c, r, 1, 1)) continue;
      kind[r * COLS + c] = 3; trees.push({ c, r, y: r * TS + 7 });

}
function connected() {
  const seen = new Uint8Array(COLS * ROWS), q = [57 * COLS + 13]; seen[q[0]] = 1;
  let n = 0;
  while (q.length) {
    const i = q.pop(); n++;
    const c = i % COLS, r = (i / COLS) | 0;
    for (const [dx, dy] of DIR4) {
      const nc = c + dx, nr = r + dy;
      if (kAt(nc, nr) !== 0) continue;
      const j = nr * COLS + nc; if (seen[j]) continue; seen[j] = 1; q.push(j);
    }

  let total = 0; for (let i = 0; i < kind.length; i++) if (kind[i] === 0) total++;

// ===================== PATHFINDING (A*) =====================
function nearestFreeTile(c, r) {
  if (kAt(c, r) === 0) return [c, r];
  for (let rad = 1; rad < 6; rad++)
    for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== rad) continue;
      if (kAt(c + dx, r + dy) === 0) return [c + dx, r + dy];
    }
  return [c, r];
}
function astar(sc, sr, gc, gr) {
  const N = COLS * ROWS, gs = new Float32Array(N).fill(1e9), from = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const heap = [], hf = [];
  const push = (i, f) => { heap.push(i); hf.push(f); let k = heap.length - 1;
    while (k > 0) { const p = (k - 1) >> 1; if (hf[p] <= hf[k]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; [hf[p], hf[k]] = [hf[k], hf[p]]; k = p; } };
  const pop = () => { const top = heap[0], li = heap.pop(), lf = hf.pop();
    if (heap.length) { heap[0] = li; hf[0] = lf; let k = 0;
      for (;;) { const l = 2 * k + 1, r = l + 1; let m = k;
        if (l < heap.length && hf[l] < hf[m]) m = l; if (r < heap.length && hf[r] < hf[m]) m = r;
        if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; [hf[m], hf[k]] = [hf[k], hf[m]]; k = m; } }
    return top; };
  const hh = (c, r) => { const dx = Math.abs(c - gc), dy = Math.abs(r - gr); return Math.max(dx, dy) + 0.414 * Math.min(dx, dy); };
  const s = sr * COLS + sc, goal = gr * COLS + gc;
  gs[s] = 0; push(s, hh(sc, sr));
  let iter = 0;
  while (heap.length && iter++ < 4000) {
    const i = pop(); if (closed[i]) continue; closed[i] = 1;
    if (i === goal) break;
    const c = i % COLS, r = (i / COLS) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nc = c + dx, nr = r + dy;
      if (kAt(nc, nr) !== 0) continue;
      if (dx && dy && (kAt(c + dx, r) !== 0 || kAt(c, r + dy) !== 0)) continue;
      const j = nr * COLS + nc; if (closed[j]) continue;
      const ng = gs[i] + (dx && dy ? 1.414 : 1);
      if (ng < gs[j]) { gs[j] = ng; from[j] = i; push(j, ng + hh(nc, nr)); }
    }
  }
  if (from[goal] === -1 && goal !== s) return null;
  const path = []; let k = goal;
  while (k !== s && k !== -1) { path.push({ x: (k % COLS) * TS + 4, y: ((k / COLS) | 0) * TS + 4 }); k = from[k]; }
  return path.reverse();
}
function findPath(x, y, gx, gy) {
  const [sc, sr] = nearestFreeTile((x / TS) | 0, (y / TS) | 0);
  const [gc, gr] = nearestFreeTile(clamp((gx / TS) | 0, 0, COLS - 1), clamp((gy / TS) | 0, 0, ROWS - 1));
  const p = astar(sc, sr, gc, gr); if (!p) return null;
  if (free(gx, gy)) { if (p.length) p[p.length - 1] = { x: gx, y: gy }; else p.push({ x: gx, y: gy }); }
  return p;
}
function lineClear(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), n = Math.ceil(L / 3);
  for (let i = 1; i <= n; i++) { const t = i / n; if (!free(x0 + dx * t, y0 + dy * t)) return false; }
  return true;
}

      const heal = p.kind === 'heal';
      rect(px - 2, py - 1, 4, 2, heal ? '#7fd85a' : C.orange); rect(px - 1, py - 2, 2, 4, heal ? '#7fd85a' : C.orange);
      rect(px - 1, py - 1, 2, 2, heal ? '#e6ffc0' : C.goldL);
    }
  }
  for (const p of parts) { g.globalAlpha = clamp(p.life / p.max, 0, 1); const s = p.sz || 1; rect(Math.round(p.x), Math.round(p.y), s, s, p.c); }
  g.globalAlpha = 1;
  for (const t of texts) { g.globalAlpha = clamp(t.life * 2, 0, 1); drawText(t.s, t.x, t.y, t.c, 'center', C.ink); }
  g.globalAlpha = 1;
  drawSide();
  if (phase === 'setup' && !over) {
    if (msg) banner(msg.s);
    else banner(((time / 3) | 0) % 2 ? 'TOQUE NUM BONECO PARA TIRAR' : 'DEPOIS TOQUE EM PRONTO', C.cream);
    drawText('?', MW / 2, 140, C.cream, 'center', C.ink);
  } else if (msg) { g.globalAlpha = clamp(msg.t, 0, 1); banner(msg.s); g.globalAlpha = 1; }
  if (phase === 'count') {
    const n = Math.ceil(countT - 1);
    rect(0, MID - 12, MW, 24, 'rgba(27,20,22,0.7)');
    drawBig(n > 0 ? n : 'BATALHA!', MW / 2, MID - 3, C.goldL, C.orange);
  }
  if (over) {
    rect(0, 0, W, H, `rgba(27,20,22,${clamp(over.t, 0, 0.65)})`);
    if (over.t > 0.4) {
      rect(0, H / 2 - 30, W, 52, 'rgba(27,20,22,0.7)'); rect(0, H / 2 - 31, W, 1, C.rust); rect(0, H / 2 + 22, W, 1, C.rust);
      drawBig(over.win ? 'VITÓRIA!' : 'DERROTA', W / 2, H / 2 - 18, over.win ? C.goldL : '#f0784a', over.win ? C.gold : '#c8361e');
      if (over.t > 1.2 && Math.sin(time * 5) > -0.4) drawText('TOQUE PARA JOGAR DE NOVO', W / 2, H / 2 + 6, C.cream, 'center', C.ink);
    }
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, OX * SC, OY * SC, W * SC, H * SC);
}

// ===================== INPUT =====================
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * LW - OX, y: (e.clientY - r.top) / r.height * LH - OY }; }
function cardAt(p) { for (let i = 0; i < 3; i++) if (p.x >= CARD_X && p.x <= CARD_X + CARD_W && p.y >= CARD_Y[i] - 3 && p.y <= CARD_Y[i] + CARD_H) return i; return -1; }
const inBtn = p => p.x >= BTN.x - 2 && p.x <= BTN.x + BTN.w + 2 && p.y >= BTN.y - 2 && p.y <= BTN.y + BTN.h + 2;
function tryDeploy(p) {
  const r = deploy(0, CARDS[sel], p.x, p.y);
  if (r === 'zone') msg = { s: 'SÓ NO SEU LADO DO CAMPO', t: 1.2 };
  else if (r === 'blocked') msg = { s: 'LUGAR BLOQUEADO', t: 1 };
  else if (!r) msg = { s: phase === 'setup' ? 'MOEDAS INSUFICIENTES' : 'OURO INSUFICIENTE', t: 1 };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toLogical(e); hover = p; hoverTouch = e.pointerType !== 'mouse';
  if (over) { if (over.t > 1.2) reset(); return; }
  if (p.x < 0 || p.y < 0 || p.x >= W || p.y >= H) return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (p.x >= MW) {
    if (phase === 'setup' && inBtn(p)) { startBattle(); return; }
    const i = cardAt(p); if (i >= 0) { sel = sel === i ? -1 : i; drag = { i, moved: false }; }
  } else if (phase === 'setup' && removeAt(p)) { /* removido */ }
  else if (sel >= 0 && phase !== 'count') tryDeploy(p);
});
cv.addEventListener('pointermove', e => { const p = toLogical(e); hover = p; hoverTouch = e.pointerType !== 'mouse'; if (drag && p.x < MW - 2) drag.moved = true; });
cv.addEventListener('pointerup', e => {
  const p = toLogical(e);
  if (drag && drag.moved && p.x >= 0 && p.x < MW && phase !== 'count' && !over) { sel = drag.i; tryDeploy(p); }
  drag = null; if (hoverTouch) hover = null;
});
cv.addEventListener('pointerleave', () => { if (!drag) hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

// Escala inteira: cada pixel lógico vira exatamente SC pixels físicos, em tudo.
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const dw = Math.floor(document.body.clientWidth * dpr), dh = Math.floor(document.body.clientHeight * dpr);
  SC = Math.max(1, Math.floor(Math.min(dw / (W + 12), dh / (H + 12))));
  LW = Math.max(W + 12, Math.floor(dw / SC)); LH = Math.max(H + 12, Math.floor(dh / SC));
  cv.width = LW * SC; cv.height = LH * SC;
  cv.style.width = (LW * SC / dpr) + 'px'; cv.style.height = (LH * SC / dpr) + 'px';
  OX = Math.floor((LW - W) / 2); OY = Math.floor((LH - H) / 2);
  buildFrame();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(frameCanvas, 0, 0, LW * SC, LH * SC);
}
addEventListener('resize', resize);

// ===================== LOOP =====================
bakeAll(); buildTree(); buildSide();
castleImg = [bakeCastle(0), bakeCastle(1)];
reset(); resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { get units() { return units; }, deploy, castles: () => castles, gold: () => gold, update, startBattle, get phase() { return phase; } };
</script>
