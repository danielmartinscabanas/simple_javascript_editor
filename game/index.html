// ===================== CONSTANTES =====================

// O campo se estica para preencher a tela (largura e altura), sempre com escala inteira.
(function fit() {

  const dpr = window.devicePixelRatio || 1, dw = Math.floor(innerWidth * dpr), dh = Math.floor(innerHeight * dpr);
  const sc = Math.max(1, Math.floor(Math.min(dw / 274, dh / 538)));

  H = Math.min(840, Math.max(528, Math.floor((dh / sc - 10) / 8) * 8));
  W = MW + SW; COLS = MW / 8; ROWS = H / 8; MID = H / 2;
})();
const R = Math.random;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
// Pós-processamento de cor (mais saturação e contraste). Usa filtro do canvas quando existe; senão, passa por pixel.
const POST = 'saturate(1.22) contrast(1.14) brightness(0.98)', SAT = 1.22, CON = 1.14, BRI = 0.98;
const FILTER_OK = typeof CanvasRenderingContext2D !== 'undefined' && 'filter' in CanvasRenderingContext2D.prototype;
const gradeCache = {};
function grade(src, key) {

  const x = t.cx; x.clearRect(0, 0, t.width, t.height);
  if (FILTER_OK) { x.filter = POST; x.drawImage(src, 0, 0); x.filter = 'none'; return t; }
  x.drawImage(src, 0, 0);
  const id = x.getImageData(0, 0, t.width, t.height), D = id.data;

const hash = (x, y) => { const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return s - Math.floor(s); };

// ===================== SPRITES (pixel art refinada) =====================
// Pipeline: ASCII de materiais -> bisel de luz (alto-esq claro, baixo-dir escuro, com mudança de matiz) -> contorno seletivo.
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const toHex = a => '#' + a.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');

const darkc = c => mixc(c, '#2c2050', 0.34);
const outc = c => mixc(c, '#140d10', 0.86);
const BAY = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bay = (x, y) => (BAY[y & 3][x & 3] + 0.5) / 16;

function compose(w, h, parts) {

}

    const base = pal[ch], diff = (qx, qy) => { const q = L(qx, qy); return q !== ch && q !== 'k' && ch !== 'k'; };
    const hi = diff(px - 1, py) || diff(px, py - 1), lo = diff(px + 1, py) || diff(px, py + 1);

  x.fillStyle = '#000';

    if (L(px, py) !== '.') continue;
    const n = [L(px, py + 1), L(px + 1, py), L(px - 1, py), L(px, py - 1)].find(q => q !== '.');
    if (!n || !pal[n]) continue;

}

function outlineCanvas(src, pad = 1) {
  const w = src.width, h = src.height, sd = src.getContext('2d').getImageData(0, 0, w, h).data;
  const c = mk(w + pad * 2, h + pad * 2), x = c.getContext('2d');
  x.drawImage(src, pad, pad);
  const A = (px, py) => px >= 0 && py >= 0 && px < w && py < h && sd[(py * w + px) * 4 + 3] > 0;
  for (let py = -1; py <= h; py++) for (let px = -1; px <= w; px++) {
    if (A(px, py)) continue;
    for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) if (A(px + dx, py + dy)) {

  }
  return c;
}

// ---- vistas direcionais: S (de frente), N (de costas), E (lado; oeste = espelho), SE/SW (lado com rosto), NE/NW (lado com nuca) ----
function backOf(grid, r0, r1, to, o = {}) {
  return grid.map((row, y) => row.map((ch, x) => {

    if (o.emblem && ch === 'g') return 't';
    return ch;
  }));
}

  for (let i = step; i < max; i += step) rect(bx, Math.round(y1 - i * bh / max), bw, 1, C.ink);
}
function button(b, label, base, light, pressed, dim) {
  bevel(b.x, b.y, b.w, b.h, dim ? '#4a3a34' : base);
  rect(b.x + 2, b.y + 2, b.w - 4, b.h - (pressed ? 4 : 6), dim ? '#5a4a42' : light[0]);
  rect(b.x + 2, b.y + 2, b.w - 4, 1, dim ? '#6a5a50' : light[1]); rect(b.x + 2, b.y + 3, 1, b.h - (pressed ? 6 : 8), dim ? '#6a5a50' : light[1]);
  drawText(label, b.x + b.w / 2 + 1, b.y + Math.floor((b.h - 6) / 2) - (pressed ? 0 : 1), dim ? '#8a7a6a' : C.ink, 'center');
}
function drawSide() {
  g.drawImage(sideCanvas, MW, 0);
  if (phase === 'setup') {
    drawText('MOEDAS', MW + 25, 5, C.gold, 'center', C.ink);
    drawBar(BAR.y0, BAR.y1, coins[0], SETUP_COINS);
    drawBig(coins[0], MW + 25, BAR.y1 + 8, C.goldL, C.gold);
    button(UNDO, 'DESFAZER', C.rust, [C.orange, '#f6a060'], false, !hist.length);
    button(BTN, 'PRONTO', C.tealD, [C.teal, C.tealL], Math.sin(time * 4) > 0.6, false);
  } else {
    drawText('OURO', MW + 25, 5, C.gold, 'center', C.ink);
    drawBar(BAR.y0, BAR.y1, gold[0], 10);
    drawBig(Math.floor(gold[0]), MW + 25, BAR.y1 + 8, C.goldL, C.gold);
    const rate = (1 / 1.5 + farmIncome(0)) * SPEED;
    drawText('+' + rate.toFixed(1) + '/S', MW + 25, BAR.y1 + 24, C.goldL, 'center', C.ink);
  }
  for (let i = 0; i < CARDS.length; i++) drawCard(i);
}
// Pergaminho: corpo com pontilhado, bordas queimadas e rolos nas pontas
function scroll(x0, y0, w, h) {
  const RW = 8, PA = ['#fff4d0', C.cream, C.parch, C.parch2, '#a8682c'];
  rect(x0 + 3, y0 + h - 1, w - 4, 3, 'rgba(20,12,16,0.44)');
  for (let py = 1; py < h - 1; py++) for (let px = RW - 2; px < w - RW + 2; px++) {
    const n = hash(px + x0, py + y0);
    let col = n < 0.05 ? PA[3] : n > 0.97 ? PA[1] : PA[2];
    if (py < 3) col = PA[1]; if (py === 1) col = PA[0]; if (py >= h - 4) col = PA[3]; if (py === h - 3) col = PA[4];
    if (py > 2 && py < h - 4 && (px < RW + 1 || px > w - RW - 2) && n < 0.5) col = PA[3];
    rect(x0 + px, y0 + py, 1, 1, col);
  }
  rect(x0 + RW - 2, y0, w - 2 * RW + 4, 1, C.ink); rect(x0 + RW - 2, y0 + h - 1, w - 2 * RW + 4, 1, C.ink);
  const roll = rx => {
    for (let py = 0; py < h; py++) for (let px = 0; px < RW; px++) {
      const corner = (py === 0 || py === h - 1) && (px === 0 || px === RW - 1); if (corner) continue;
      const edge = px === 0 || px === RW - 1 || py === 0 || py === h - 1;
      const u = px / (RW - 1); const lu = rx === 0 ? u : 1 - u;
      rect(x0 + rx + px, y0 + py, 1, 1, edge ? C.ink : lu < 0.3 ? PA[0] : lu < 0.55 ? PA[1] : lu < 0.8 ? PA[2] : PA[3]);
    }
    for (const py of [3, h - 4]) { rect(x0 + rx + 2, y0 + py, RW - 4, 1, PA[4]); rect(x0 + rx + 3, y0 + py + (py < h / 2 ? 1 : -1), RW - 6, 1, PA[3]); }
  };
  roll(0); roll(w - RW);
}
function banner(s, col = C.ink) {
  const w = Math.max(96, textW(String(s)) + 40), h = 22;
  scroll(Math.round(MW / 2 - w / 2), MID - 11, w, h);
  drawText(s, MW / 2, MID - 3, col, 'center');
}
function drawCrop(x, y, age, seed) {
  if (age < 2) { rect(x + 3, y + 5, 2, 1, '#c8894a'); rect(x + 3, y + 4, 1, 1, '#e8c088'); return; }
  const sway = Math.round(Math.sin(time * 2.5 + seed) * 0.6);
  for (const dx of [1, 3, 5]) {
    if (age < 6) { rect(x + dx, y + 5, 1, 2, '#5aa032'); rect(x + dx + 1, y + 4, 1, 1, '#8cd04c'); rect(x + dx - 1, y + 4, 1, 1, '#8cd04c'); }
    else if (age < 10) { rect(x + dx, y + 3, 1, 4, '#5aa032'); rect(x + dx + sway, y + 2, 1, 1, '#a8d84c'); rect(x + dx - 1 + sway, y + 4, 1, 1, '#8cd04c'); }
    else { rect(x + dx, y + 2, 1, 5, '#c89030'); rect(x + dx + sway, y, 1, 3, C.gold); rect(x + dx + sway - 1, y + 1, 1, 1, '#e8a028'); rect(x + dx + sway + 1, y + 1, 1, 1, '#e8a028'); rect(x + dx + sway, y - 1, 1, 1, C.goldL); }
  }
}
function drawFarms() {
  for (const fm of farms) for (const c of fm.cells) {
    if (fm.hitT > 0) rect(c.x, c.y, 8, 8, 'rgba(200,54,30,0.25)');
    if (c.age >= 0) drawCrop(c.x, c.y, c.age, (c.x >> 3) * 7 + (c.y >> 3) * 3);
  }
}
function render() {
  g.drawImage(bgCanvas, 0, 0);
  for (const s of shimmer) { const v = Math.sin(time * s.sp + s.ph); if (v > 0.55) rect(s.x, s.y, v > 0.85 ? 3 : 2, 1, v > 0.85 ? '#e8ffff' : C.tealL); }
  drawFarms();
  const placing = (sel >= 0 && phase !== 'count') || phase === 'setup';
  if (placing && !over) {
    rect(0, 0, MW, MID + 8, phase === 'setup' ? 'rgba(20,12,16,0.46)' : 'rgba(200,54,30,0.18)');
    g.fillStyle = C.cream; for (let px = (time * 12 | 0) % 6; px < MW; px += 6) g.fillRect(px, MID + 8, 3, 1);
  }
  if (sel >= 0 && CARDS[sel] === 'farmer' && phase !== 'count' && !over && farms[0]) {
    const f = farms[0], pulse = Math.sin(time * 6) > 0;
    for (const c of f.cells) rect(c.x, c.y, 8, 8, pulse ? 'rgba(255,240,184,0.32)' : 'rgba(255,240,184,0.16)');
  }
  for (const c of castles) drawCastle(c);
  const list = [];
  for (const u of units) list.push({ y: u.y, u });
  for (const t of trees) list.push({ y: t.y, t });
  for (const f of fences) list.push({ y: f.ry + 7, f });
  list.sort((a, b) => a.y - b.y);
  for (const o of list) { if (o.u) drawUnit(o.u); else if (o.f) drawFence(o.f); else g.drawImage(treeImg, o.t.c * TS + 4 - 12, o.t.y - 29); }
  if (sel >= 0 && hover && hover.x >= 0 && hover.x < MW && !over && phase !== 'count' && (!hoverTouch || (drag && drag.moved))) {
    const fm0 = farms[0], isF = CARDS[sel] === 'farmer';
    const ok = (isF ? (fm0 && fm0.cells.some(c => hover.x >= c.x && hover.x < c.x + 8 && hover.y >= c.y && hover.y < c.y + 8)) : (hover.y >= MID + 8 && hover.y <= H - 72)) && purse()[0] >= DEF[CARDS[sel]].cost;
    if (CARDS[sel] === 'fence') {
      const sp = fenceSpot(hover.x, hover.y), good = ok && fenceOk(sp.c, sp.r);
      drawFence({ team: 0, rx: sp.c * TS, ry: sp.r * TS, hp: 1, max: 1, hitT: 0 }, good ? 0.65 : 0.25);
      rect(sp.c * TS, sp.r * TS + 9, 24, 1, good ? C.cream : C.rust);
    } else {
    drawUnit({ type: CARDS[sel], d: DEF[CARDS[sel]], x: hover.x, y: hover.y, team: 0, face: 1, fx: 1, fy: 0, moving: false, atkT: 0, hitT: 0, healFx: 0, deployT: 0, hp: 1, max: 1 }, ok ? 0.6 : 0.25);
    rect(Math.round(hover.x) - 6, Math.round(hover.y) + 3, 12, 1, ok ? C.cream : C.rust); }
  }
  for (const p of projs) {
    const px = Math.round(p.x), py = Math.round(p.y);
    if (p.kind === 'arrow') {
      for (let k = 0; k < 5; k++) rect(Math.round(p.x - (p.vx || 0) * k), Math.round(p.y - (p.vy || 0) * k), 1, 1, k === 0 ? '#dcdcd8' : k > 3 ? C.cream : '#9a5a2c');
    } else {
      const heal = p.kind === 'heal';
      rect(px - 2, py - 1, 4, 2, heal ? '#7fd85a' : C.orange); rect(px - 1, py - 2, 2, 4, heal ? '#7fd85a' : C.orange);
      rect(px - 1, py - 1, 2, 2, heal ? '#e6ffc0' : C.goldL);
    }
  }
  for (const p of parts) { g.globalAlpha = clamp(p.life / p.max, 0, 1); const s = p.sz || 1; rect(Math.round(p.x), Math.round(p.y), s, s, p.c); }
  g.globalAlpha = 1;
  for (const t of texts) { g.globalAlpha = clamp(t.life * 2, 0, 1); drawText(t.s, t.x, t.y, t.c, 'center', C.ink); }
  g.globalAlpha = 1;
  drawSide();
  if (phase === 'setup' && !over) {
    if (msg) banner(msg.s);
    else banner(((time / 3) | 0) % 2 ? 'TOQUE NUM BONECO PARA TIRAR' : 'DEPOIS TOQUE EM PRONTO', C.ember);
    drawText('?', MW / 2, 140, C.cream, 'center', C.ink);
  } else if (msg) { g.globalAlpha = clamp(msg.t, 0, 1); banner(msg.s); g.globalAlpha = 1; }
  if (phase === 'count') {
    const n = Math.ceil(countT - 1);
    const cw = n > 0 ? 64 : 120; scroll(Math.round(MW / 2 - cw / 2), MID - 16, cw, 32);
    drawBig(n > 0 ? n : 'BATALHA!', MW / 2, MID - 4, C.rust, C.ember);
  }
  if (over) {
    rect(0, 0, W, H, `rgba(27,20,22,${clamp(over.t, 0, 0.65)})`);
    if (over.t > 0.4) {
      const sw = Math.min(W - 16, 200); scroll(Math.round(W / 2 - sw / 2), H / 2 - 32, sw, 62);
      drawBig(over.win ? 'VITÓRIA!' : 'DERROTA', W / 2, H / 2 - 20, over.win ? '#2f8a3a' : '#c8361e', over.win ? '#1d5a2a' : C.ember);
      if (over.t > 1.2 && Math.sin(time * 5) > -0.4) drawText('TOQUE PARA JOGAR DE NOVO', W / 2, H / 2 + 12, C.ink, 'center');
    }
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(grade(buf, 'game'), OX * SC, OY * SC, W * SC, H * SC);
}

// ===================== INPUT =====================
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * LW - OX, y: (e.clientY - r.top) / r.height * LH - OY }; }
function cardAt(p) { for (let i = 0; i < CARDS.length; i++) if (p.x >= CARD_X && p.x <= CARD_X + CARD_W && p.y >= CARD_Y[i] - 2 && p.y <= CARD_Y[i] + CARD_H) return i; return -1; }
const inRect = (p, b) => p.x >= b.x - 2 && p.x <= b.x + b.w + 2 && p.y >= b.y - 2 && p.y <= b.y + b.h + 2;
const inBtn = p => inRect(p, BTN);
function tryDeploy(p) {
  const r = deploy(0, CARDS[sel], p.x, p.y);
  if (r && typeof r === 'object' && phase === 'setup') hist.push(r);
  if (r === 'farm') msg = { s: 'SÓ NA ÁREA DE CULTIVO', t: 1.2 };
  else if (r === 'maxfarm') msg = { s: 'LIMITE DE ' + MAX_FARMERS + ' AGRICULTORES', t: 1.4 };
  else if (r === 'zone') msg = { s: 'SÓ NO SEU LADO DO CAMPO', t: 1.2 };
  else if (r === 'blocked') msg = { s: 'LUGAR BLOQUEADO', t: 1 };
  else if (!r) msg = { s: phase === 'setup' ? 'MOEDAS INSUFICIENTES' : 'OURO INSUFICIENTE', t: 1 };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toLogical(e); hover = p; hoverTouch = e.pointerType !== 'mouse';
  if (over) { if (over.t > 1.2) reset(); return; }
  if (p.x < 0 || p.y < 0 || p.x >= W || p.y >= H) return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (p.x >= MW) {
    if (phase === 'setup' && inBtn(p)) { startBattle(); return; }
    if (phase === 'setup' && inRect(p, UNDO)) { if (!undo()) msg = { s: 'NADA PARA DESFAZER', t: 1 }; return; }
    const i = cardAt(p); if (i >= 0) { sel = sel === i ? -1 : i; drag = { i, moved: false }; }
  } else if (phase === 'setup' && removeAt(p)) { /* removido */ }
  else if (sel >= 0 && phase !== 'count') tryDeploy(p);
});
cv.addEventListener('pointermove', e => { const p = toLogical(e); hover = p; hoverTouch = e.pointerType !== 'mouse'; if (drag && p.x < MW - 2) drag.moved = true; });
cv.addEventListener('pointerup', e => {
  const p = toLogical(e);
  if (drag && drag.moved && p.x >= 0 && p.x < MW && phase !== 'count' && !over) { sel = drag.i; tryDeploy(p); }
  drag = null; if (hoverTouch) hover = null;
});
cv.addEventListener('pointerleave', () => { if (!drag) hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

// Escala inteira: cada pixel lógico vira exatamente SC pixels físicos, em tudo.
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const dw = Math.floor(document.body.clientWidth * dpr), dh = Math.floor(document.body.clientHeight * dpr);
  SC = Math.max(1, Math.floor(Math.min(dw / (W + 10), dh / (H + 10))));
  LW = Math.max(W + 10, Math.floor(dw / SC)); LH = Math.max(H + 10, Math.floor(dh / SC));
  cv.width = LW * SC; cv.height = LH * SC;
  cv.style.width = (LW * SC / dpr) + 'px'; cv.style.height = (LH * SC / dpr) + 'px';
  OX = Math.floor((LW - W) / 2); OY = Math.floor((LH - H) / 2);
  buildFrame();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(grade(frameCanvas, 'frame'), 0, 0, LW * SC, LH * SC);
}
addEventListener('resize', resize);

// ===================== LOOP =====================
bakeAll(); buildTree(); buildSide();
castleImg = [bakeCastle(0, true), bakeCastle(1, false)];
reset(); resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { undo, get hist() { return hist; }, get units() { return units; }, deploy, castles: () => castles, gold: () => gold, update, startBattle, get phase() { return phase; } };
</script>
