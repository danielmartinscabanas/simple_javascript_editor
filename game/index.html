<script>
'use strict';
// ===================== CONSTANTES =====================
const SW = 48, TS = 8;
let MW = 216, W = MW + SW, H = 528, COLS = 27, ROWS = 66, MID = 264;
// O campo se estica para preencher a tela (largura e altura), sempre com escala inteira.
(function fit() {
  if (!innerWidth || !innerHeight) return;
  const dpr = window.devicePixelRatio || 1, dw = Math.floor(innerWidth * dpr), dh = Math.floor(innerHeight * dpr);
  const sc = Math.max(1, Math.floor(Math.min(dw / 274, dh / 538)));
  MW = Math.min(336, Math.max(216, Math.floor((dw / sc - 10 - SW) / 8) * 8));
  H = Math.min(840, Math.max(528, Math.floor((dh / sc - 10) / 8) * 8));
  W = MW + SW; COLS = MW / 8; ROWS = H / 8; MID = H / 2;
})();
const R = Math.random;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const buf = mk(W, H); let g = buf.getContext('2d');
let LW = W + 10, LH = H + 10, SC = 1, OX = 5, OY = 5;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = (x, y) => { const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return s - Math.floor(s); };

// Paleta inspirada no banner de referência: contorno preto quente, laranja, creme/pergaminho, dourado, azul-escudo, vermelho-ferrugem, verde-lima.
const C = {

  { t: '#c8361e', T: '#7a1d12', h: '#f0784a', bar: '#e8452a' }, // bot (vermelho, em cima)

const BASEPAL = { k: C.ink, m: '#dcdcd8', M: '#8c8f99', s: '#f2b27a', S: '#c27848', e: C.ink, b: '#a0582a', B: '#5a2e18',

// ===================== SPRITES (pixel art refinada) =====================
// Pipeline: ASCII de materiais -> bisel de luz (alto-esq claro, baixo-dir escuro, com mudança de matiz) -> contorno seletivo.
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const toHex = a => '#' + a.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const mixc = (a, b, t) => { const A = hx(a), B = hx(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)); };
const lightc = c => mixc(c, '#fff2b8', 0.30);
const darkc = c => mixc(c, '#2c2050', 0.34);
const outc = c => mixc(c, '#1b1416', 0.72);
const BAY = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bay = (x, y) => (BAY[y & 3][x & 3] + 0.5) / 16;

function compose(w, h, parts) {
  const gr = Array.from({ length: h }, () => Array(w).fill('.'));
  for (const [ox, oy, rows] of parts) rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) {
    const ch = r[i], X = ox + i, Y = oy + j; if (ch !== '.' && X >= 0 && Y >= 0 && X < w && Y < h) gr[Y][X] = ch; } });
  return gr;
}
const vline = (n, ch) => Array(n).fill(ch);
function renderGrid(grid, pal) {
  const h = grid.length, w = grid[0].length, c = mk(w + 2, h + 2), x = c.getContext('2d');
  const L = (px, py) => (px < 0 || py < 0 || px >= w || py >= h) ? '.' : grid[py][px];
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    const ch = L(px, py); if (ch === '.' || !pal[ch]) continue;
    const base = pal[ch], diff = (qx, qy) => { const q = L(qx, qy); return q !== ch && q !== 'k' && ch !== 'k'; };
    const hi = diff(px - 1, py) || diff(px, py - 1), lo = diff(px + 1, py) || diff(px, py + 1);
    let col = base;
    if (lo && !hi) col = darkc(base); else if (hi && !lo) col = lightc(base);
    else if (!hi && !lo && 'whHt'.includes(ch) && hash(px * 3, py * 7) < 0.14) col = darkc(base);
    x.fillStyle = col; x.fillRect(px + 1, py + 1, 1, 1);
  }
  x.fillStyle = '#000';
  for (let py = -1; py <= h; py++) for (let px = -1; px <= w; px++) {
    if (L(px, py) !== '.') continue;
    const n = [L(px, py + 1), L(px + 1, py), L(px - 1, py), L(px, py - 1)].find(q => q !== '.');
    if (!n || !pal[n]) continue;
    x.fillStyle = outc(pal[n]); x.fillRect(px + 1, py + 1, 1, 1);
  }
  return c;
}
// contorno seletivo para qualquer canvas (árvores, castelo)
function outlineCanvas(src, pad = 1) {
  const w = src.width, h = src.height, sd = src.getContext('2d').getImageData(0, 0, w, h).data;
  const c = mk(w + pad * 2, h + pad * 2), x = c.getContext('2d');
  x.drawImage(src, pad, pad);
  const A = (px, py) => px >= 0 && py >= 0 && px < w && py < h && sd[(py * w + px) * 4 + 3] > 0;
  for (let py = -1; py <= h; py++) for (let px = -1; px <= w; px++) {
    if (A(px, py)) continue;
    for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) if (A(px + dx, py + dy)) {
      const i = ((py + dy) * w + px + dx) * 4; x.fillStyle = outc(toHex([sd[i], sd[i + 1], sd[i + 2]])); x.fillRect(px + pad, py + pad, 1, 1); break; }
  }
  return c;
}

const PAWN_A = compose(16, 19, [[0, 0, [

const BISHOP_A = compose(16, 21, [[1, 0, BISHOP_BODY], [3, 19, ['dd......dd']], [13, 0, ['.g.', 'ggg', '.g.']], [14, 3, vline(17, 'd')], [13, 12, ['s']]]);

const ARCHER_BODY = ['...TTTT...', '..TTTTTT..', '.TTTTTTTT.', '.TTsssTTT.', '.TsskssTT.', '..TsssssT.', '...ssss...', '.dttttttt.', 'ddttttttss', 'ddtttgttts', 'dbbbbbbbb.', '.tttttttt.', '.tttttttt.', '.mtttttt..'];

const ARCHER_A = compose(16, 18, [[0, 0, ARCHER_BODY], [11, 3, ARCHER_BOW], [10, 4, vline(7, 'w')], [9, 7, ['sbbbbbm']], [2, 14, ['tt..tt']], [2, 15, ['mm..mm']], [2, 16, ['bb..bb']], [1, 17, ['dbb..bbd']]]);
const ARCHER_B = compose(16, 18, [[0, 0, ARCHER_BODY], [11, 3, ARCHER_BOW], [10, 4, vline(7, 'w')], [9, 7, ['sbbbbbm']], [3, 14, ['tt.tt']], [3, 15, ['mm.mm']], [2, 16, ['bb..bb']], [2, 17, ['dbb.bbd']]]);
function makeFence() {
  const w = 26, h = 14, gr = Array.from({ length: h }, () => Array(w).fill('.'));
  const S = (x, y, ch) => { if (x >= 0 && y >= 0 && x < w && y < h) gr[y][x] = ch; };
  for (let x = 0; x < w; x++) { S(x, 5, 'W'); S(x, 6, 'b'); S(x, 9, 'W'); S(x, 10, 'b'); }
  const posts = [1, 6, 11, 16, 21];
  for (let i = 0; i < 4; i++) { const g0 = posts[i] + 2; for (let y = 3; y <= 11; y++) { const t = Math.round((y - 3) / 8 * 2); S(g0 + t, y, 'd'); S(g0 + 2 - t, y, 'd'); } }
  for (const px of posts) { for (let y = 2; y <= 12; y++) { S(px, y, 'W'); S(px + 1, y, 'b'); } S(px, 0, 'W'); S(px, 1, 'W'); S(px + 1, 1, 'b'); S(px, 13, 'd'); S(px + 1, 13, 'd'); }
  for (const [x, y] of [[13, 1], [14, 1], [13, 2], [14, 2], [15, 2]]) S(x, y, 't');
  S(13, 3, 'T'); S(14, 3, 'T');
  return gr;
}
const FENCE_A = makeFence();

const SP = {};
function bakeAll() {
  const defs = { pawn: [PAWN_A, PAWN_B], knight: [KNIGHT_A, KNIGHT_B], bishop: [BISHOP_A, BISHOP_B], archer: [ARCHER_A, ARCHER_B], fence: [FENCE_A] };
  for (const k in defs) {
    SP[k] = { img: [], white: [] };
    for (let t = 0; t < 2; t++) {
      const pal = { m: '#b9c2ce', s: '#f2b27a', t: TEAM[t].t, T: TEAM[t].T, p: TEAM[t].h, g: C.gold, G: C.goldD, b: '#a0582a', d: '#5e3218',
        h: t ? '#8a5430' : '#b97a42', H: t ? '#63391f' : '#8e5a2e', w: '#f3ead6', c: '#e8d4a0', k: C.ink };
      SP[k].img[t] = defs[k].map(gr => { const cc = renderGrid(gr, pal); const f = mk(cc.width, cc.height), fx = f.getContext('2d');
        fx.translate(cc.width, 0); fx.scale(-1, 1); fx.drawImage(cc, 0, 0); return [cc, f]; });
    }
    SP[k].w = SP[k].img[0][0][0].width; SP[k].h = SP[k].img[0][0][0].height;
    SP[k].white = SP[k].img[0].map(pair => pair.map(cc => { const f = mk(cc.width, cc.height), fx = f.getContext('2d');
      fx.drawImage(cc, 0, 0); fx.globalCompositeOperation = 'source-in'; fx.fillStyle = '#fff'; fx.fillRect(0, 0, cc.width, cc.height); return f; }));
  }
}

// ===================== FONTES PIXEL (3x5 e 5x7, sempre 1:1) =====================
const FONT = {
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',
  G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',
  M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',

  Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
  '4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
  '!':'010010010000010',':':'000010000010000','.':'000000000000010','-':'000000111000000','+':'000010111010000','/':'001001010100100',' ':'000000000000000',
};
const BIG = {
  A:'01110100011000111111100011000110001',B:'11110100011000111110100011000111110',C:'01110100011000010000100001000101110',
  D:'11110100011000110001100011000111110',E:'11111100001000011110100001000011111',F:'11111100001000011110100001000010000',
  G:'01110100011000010111100011000101111',H:'10001100011000111111100011000110001',I:'01110001000010000100001000010001110',
  J:'00111000100001000010000101001001100',K:'10001100101010011000101001001010001',L:'10000100001000010000100001000011111',
  M:'10001110111010110101100011000110001',N:'10001100011100110101100111000110001',O:'01110100011000110001100011000101110',
  P:'11110100011000111110100001000010000',Q:'01110100011000110001101011001001101',R:'11110100011000111110101001001010001',
  S:'01111100001000001110000010000111110',T:'11111001000010000100001000010000100',U:'10001100011000110001100011000101110',
  V:'10001100011000110001100010101000100',W:'10001100011000110101101011010101010',X:'10001100010101000100010101000110001',
  Y:'10001100010101000100001000010000100',Z:'11111000010001000100010001000011111',
  '0':'01110100011001110101110011000101110','1':'00100011000010000100001000010001110','2':'01110100010000100010001000100011111',
  '3':'11111000100010000010000011000101110','4':'00010001100101010010111110001000010','5':'11111100001111000001000011000101110',
  '6':'00110010001000011110100011000101110','7':'11111000010001000100010000100001000','8':'01110100011000101110100011000101110',
  '9':'01110100011000101111000010001001100','!':'00100001000010000100001000000000100',' ':'00000000000000000000000000000000000',
};
const ACC = { 'Ã': ['A', [[0,-2],[1,-2],[2,-2]]], 'Ó': ['O', [[1,-2],[2,-2]]], 'Ç': ['C', [[1,5]]], 'Á': ['A', [[1,-2],[2,-2]]] };
const ACCB = { 'Ó': ['O', [[2,-2],[3,-2],[3,-3],[4,-3]]], 'Ã': ['A', [[0,-2],[1,-3],[2,-2],[3,-2],[4,-3]]], 'Á': ['A', [[2,-2],[3,-2],[3,-3],[4,-3]]] };
const textW = s => s.length * 4 - 1;
function drawText(s, x, y, col, align = 'left', shadow) {
  s = String(s).toUpperCase();
  const w = textW(s);
  const cx = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  if (shadow) drawRaw(s, cx + 1, y + 1, shadow);
  drawRaw(s, cx, y, col);
}
function drawRaw(s, cx, y, col) {
  g.fillStyle = col;
  for (const ch of s) {
    let base = ch, extra = null;
    if (ACC[ch]) { base = ACC[ch][0]; extra = ACC[ch][1]; }
    const gl = FONT[base] || FONT[' '];
    for (let i = 0; i < 15; i++) if (gl[i] === '1') g.fillRect(cx + (i % 3), y + ((i / 3) | 0), 1, 1);
    if (extra) for (const [ex, ey] of extra) g.fillRect(cx + ex, y + ey, 1, 1);
    cx += 4;
  }
}
// Título grosso estilo banner: glifo 5x7 em negrito, duas cores e contorno preto. Pixels sempre 1:1.
function drawBig(s, x, y, fill, shade, outline = C.ink) {
  s = String(s).toUpperCase();
  const w = s.length * 7 + 2, h = 13, m = new Uint8Array(w * h);
  let cx = 1;
  for (const ch of s) {
    let base = ch, extra = [];
    if (ACCB[ch]) { base = ACCB[ch][0]; extra = ACCB[ch][1]; }
    const gl = BIG[base] || BIG[' '];
    for (let i = 0; i < 35; i++) if (gl[i] === '1') { const px = cx + i % 5, py = 4 + ((i / 5) | 0); m[py * w + px] = 1 + (py >= 8 ? 1 : 0); m[py * w + px + 1] = 1 + (py >= 8 ? 1 : 0); }
    for (const [ex, ey] of extra) { m[(4 + ey) * w + cx + ex] = 1; }
    cx += 7;
  }
  const ox = Math.round(x - w / 2), oy = y - 4;
  g.fillStyle = outline;
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    if (m[py * w + px]) continue;
    let n = false;
    for (let dy = -1; dy <= 1 && !n; dy++) for (let dx = -1; dx <= 1; dx++) { const qx = px + dx, qy = py + dy; if (qx >= 0 && qy >= 0 && qx < w && qy < h && m[qy * w + qx]) { n = true; break; } }
    if (n || (py > 0 && m[(py - 1) * w + px] && py < h)) g.fillRect(ox + px, oy + py, 1, 1);
  }
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    const v = m[py * w + px]; if (!v) continue;
    g.fillStyle = v === 2 ? shade : fill; g.fillRect(ox + px, oy + py, 1, 1);
  }
}

const kAt = (c, r) => (c < 0 || r < 0 || c >= COLS || r >= ROWS) ? 9 : kind[r * COLS + c];

function render() {
  g.drawImage(bgCanvas, 0, 0);
  for (const s of shimmer) { const v = Math.sin(time * s.sp + s.ph); if (v > 0.55) rect(s.x, s.y, v > 0.85 ? 3 : 2, 1, v > 0.85 ? '#e8ffff' : C.tealL); }
  const placing = (sel >= 0 && phase !== 'count') || phase === 'setup';
  if (placing && !over) {
    rect(0, 0, MW, MID + 8, phase === 'setup' ? 'rgba(27,20,22,0.35)' : 'rgba(200,54,30,0.18)');
    g.fillStyle = C.cream; for (let px = (time * 12 | 0) % 6; px < MW; px += 6) g.fillRect(px, MID + 8, 3, 1);
  }
  for (const c of castles) drawCastle(c);
  const list = [];
  for (const u of units) list.push({ y: u.y, u });
  for (const t of trees) list.push({ y: t.y, t });
  for (const f of fences) list.push({ y: f.ry + 7, f });
  list.sort((a, b) => a.y - b.y);
  for (const o of list) { if (o.u) drawUnit(o.u); else if (o.f) drawFence(o.f); else g.drawImage(treeImg, o.t.c * TS + 4 - 12, o.t.y - 29); }
  if (sel >= 0 && hover && hover.x >= 0 && hover.x < MW && !over && phase !== 'count' && (!hoverTouch || (drag && drag.moved))) {
    const ok = hover.y >= MID + 8 && hover.y <= H - 72 && purse()[0] >= DEF[CARDS[sel]].cost;
    if (CARDS[sel] === 'fence') {
      const sp = fenceSpot(hover.x, hover.y), good = ok && fenceOk(sp.c, sp.r);
      drawFence({ team: 0, rx: sp.c * TS, ry: sp.r * TS, hp: 1, max: 1, hitT: 0 }, good ? 0.65 : 0.25);
      rect(sp.c * TS, sp.r * TS + 9, 24, 1, good ? C.cream : C.rust);
    } else {
    drawUnit({ type: CARDS[sel], d: DEF[CARDS[sel]], x: hover.x, y: hover.y, team: 0, face: 1, moving: false, atkT: 0, hitT: 0, deployT: 0, hp: 1, max: 1 }, ok ? 0.6 : 0.25);
    rect(Math.round(hover.x) - 6, Math.round(hover.y) + 3, 12, 1, ok ? C.cream : C.rust); }
  }
  for (const p of projs) {
    const px = Math.round(p.x), py = Math.round(p.y);
    if (p.kind === 'arrow') {
      for (let k = 0; k < 5; k++) rect(Math.round(p.x - (p.vx || 0) * k), Math.round(p.y - (p.vy || 0) * k), 1, 1, k === 0 ? '#dcdcd8' : k > 3 ? C.cream : '#9a5a2c');
    } else {
      const heal = p.kind === 'heal';
      rect(px - 2, py - 1, 4, 2, heal ? '#7fd85a' : C.orange); rect(px - 1, py - 2, 2, 4, heal ? '#7fd85a' : C.orange);
      rect(px - 1, py - 1, 2, 2, heal ? '#e6ffc0' : C.goldL);
    }
  }
  for (const p of parts) { g.globalAlpha = clamp(p.life / p.max, 0, 1); const s = p.sz || 1; rect(Math.round(p.x), Math.round(p.y), s, s, p.c); }
  g.globalAlpha = 1;
  for (const t of texts) { g.globalAlpha = clamp(t.life * 2, 0, 1); drawText(t.s, t.x, t.y, t.c, 'center', C.ink); }
  g.globalAlpha = 1;
  drawSide();
  if (phase === 'setup' && !over) {
    if (msg) banner(msg.s);
    else banner(((time / 3) | 0) % 2 ? 'TOQUE NUM BONECO PARA TIRAR' : 'DEPOIS TOQUE EM PRONTO', C.cream);
    drawText('?', MW / 2, 140, C.cream, 'center', C.ink);
  } else if (msg) { g.globalAlpha = clamp(msg.t, 0, 1); banner(msg.s); g.globalAlpha = 1; }
  if (phase === 'count') {
    const n = Math.ceil(countT - 1);
    rect(0, MID - 12, MW, 24, 'rgba(27,20,22,0.7)');
    drawBig(n > 0 ? n : 'BATALHA!', MW / 2, MID - 3, C.goldL, C.orange);
  }
  if (over) {
    rect(0, 0, W, H, `rgba(27,20,22,${clamp(over.t, 0, 0.65)})`);
    if (over.t > 0.4) {
      rect(0, H / 2 - 30, W, 52, 'rgba(27,20,22,0.7)'); rect(0, H / 2 - 31, W, 1, C.rust); rect(0, H / 2 + 22, W, 1, C.rust);
      drawBig(over.win ? 'VITÓRIA!' : 'DERROTA', W / 2, H / 2 - 18, over.win ? C.goldL : '#f0784a', over.win ? C.gold : '#c8361e');
      if (over.t > 1.2 && Math.sin(time * 5) > -0.4) drawText('TOQUE PARA JOGAR DE NOVO', W / 2, H / 2 + 6, C.cream, 'center', C.ink);
    }
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, OX * SC, OY * SC, W * SC, H * SC);
}

// ===================== INPUT =====================
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * LW - OX, y: (e.clientY - r.top) / r.height * LH - OY }; }
function cardAt(p) { for (let i = 0; i < CARDS.length; i++) if (p.x >= CARD_X && p.x <= CARD_X + CARD_W && p.y >= CARD_Y[i] - 2 && p.y <= CARD_Y[i] + CARD_H) return i; return -1; }
const inRect = (p, b) => p.x >= b.x - 2 && p.x <= b.x + b.w + 2 && p.y >= b.y - 2 && p.y <= b.y + b.h + 2;
const inBtn = p => inRect(p, BTN);
function tryDeploy(p) {
  const r = deploy(0, CARDS[sel], p.x, p.y);
  if (r && typeof r === 'object' && phase === 'setup') hist.push(r);
  if (r === 'zone') msg = { s: 'SÓ NO SEU LADO DO CAMPO', t: 1.2 };
  else if (r === 'blocked') msg = { s: 'LUGAR BLOQUEADO', t: 1 };
  else if (!r) msg = { s: phase === 'setup' ? 'MOEDAS INSUFICIENTES' : 'OURO INSUFICIENTE', t: 1 };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toLogical(e); hover = p; hoverTouch = e.pointerType !== 'mouse';
  if (over) { if (over.t > 1.2) reset(); return; }
  if (p.x < 0 || p.y < 0 || p.x >= W || p.y >= H) return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (p.x >= MW) {
    if (phase === 'setup' && inBtn(p)) { startBattle(); return; }
    if (phase === 'setup' && inRect(p, UNDO)) { if (!undo()) msg = { s: 'NADA PARA DESFAZER', t: 1 }; return; }
    const i = cardAt(p); if (i >= 0) { sel = sel === i ? -1 : i; drag = { i, moved: false }; }
  } else if (phase === 'setup' && removeAt(p)) { /* removido */ }
  else if (sel >= 0 && phase !== 'count') tryDeploy(p);
});
cv.addEventListener('pointermove', e => { const p = toLogical(e); hover = p; hoverTouch = e.pointerType !== 'mouse'; if (drag && p.x < MW - 2) drag.moved = true; });
cv.addEventListener('pointerup', e => {
  const p = toLogical(e);
  if (drag && drag.moved && p.x >= 0 && p.x < MW && phase !== 'count' && !over) { sel = drag.i; tryDeploy(p); }
  drag = null; if (hoverTouch) hover = null;
});
cv.addEventListener('pointerleave', () => { if (!drag) hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

// Escala inteira: cada pixel lógico vira exatamente SC pixels físicos, em tudo.
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const dw = Math.floor(document.body.clientWidth * dpr), dh = Math.floor(document.body.clientHeight * dpr);
  SC = Math.max(1, Math.floor(Math.min(dw / (W + 10), dh / (H + 10))));
  LW = Math.max(W + 10, Math.floor(dw / SC)); LH = Math.max(H + 10, Math.floor(dh / SC));
  cv.width = LW * SC; cv.height = LH * SC;
  cv.style.width = (LW * SC / dpr) + 'px'; cv.style.height = (LH * SC / dpr) + 'px';
  OX = Math.floor((LW - W) / 2); OY = Math.floor((LH - H) / 2);
  buildFrame();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(frameCanvas, 0, 0, LW * SC, LH * SC);
}
addEventListener('resize', resize);

// ===================== LOOP =====================
bakeAll(); buildTree(); buildSide();
castleImg = [bakeCastle(0, true), bakeCastle(1, false)];
reset(); resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { undo, get hist() { return hist; }, get units() { return units; }, deploy, castles: () => castles, gold: () => gold, update, startBattle, get phase() { return phase; } };
</script>
</body>
</html>
